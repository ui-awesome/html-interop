<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 620" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Backed Enum Interop</text>
        <text class="content" x="32" y="66">String-backed PHP enums for predictable HTML tag names</text>
        <text class="content" x="32" y="84">BackedEnum-friendly values for builders and reusable components</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Block &amp; Inline Tags</text>
        <text class="content" x="32" y="166">Dedicated Block and Inline enums for common HTML element sets</text>
        <text class="content" x="32" y="184">Standards-aligned names for document and phrasing content</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">List &amp; Table Tags</text>
        <text class="content" x="32" y="266">Specialized Lists and Table enums for structured markup</text>
        <text class="content" x="32" y="284">Typed cases for ul, ol, li, table, thead, tbody, tr, th and td</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Metadata Tags</text>
        <text class="content" x="32" y="366">Separate MetadataBlock and MetadataVoid enums for head content</text>
        <text class="content" x="32" y="384">Script, style and template alongside base, link and meta</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">Root Elements</text>
        <text class="content" x="32" y="466">Root enum for html, head and body document structure</text>
        <text class="content" x="32" y="484">Clear boundaries for top-level HTML document composition</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Void Elements</text>
        <text class="content" x="32" y="566">Void enum for self-closing HTML elements like br, img and input</text>
        <text class="content" x="32" y="584">Safe tag selection for renderers that distinguish empty elements</text>
    </g>
</svg>
