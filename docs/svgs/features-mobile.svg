<!-- Mobile layout - Single column -->
<svg fill="none" viewBox="0 0 600 370" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                .container {
                    display: grid;
                    grid-template-columns: 1fr;
                    gap: 16px;
                    padding: 16px;
                }
                .alert-box {
                    border-left: 4px solid #1f883d;
                    padding: 12px;
                    margin-bottom: 12px;
                    border-radius: 6px;
                    background: rgba(31, 136, 61, 0.1);
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                    width: 100%;
                    box-sizing: border-box;
                }
                .alert-title {
                    margin: 0 0 8px 0;
                    font-weight: 600;
                    font-size: 14px;
                }
                .alert-content {
                    margin: 0;
                    line-height: 1.4;
                    font-size: 12px;
                }

                /* Light mode */
                @media (prefers-color-scheme: light) {
                    .alert-title { color: #000000; }
                    .alert-content { color: #333333; }
                    .alert-box { background: rgba(31, 136, 61, 0.1); }
                }

                /* Dark mode */
                @media (prefers-color-scheme: dark) {
                    .alert-title { color: #ffffff; }
                    .alert-content { color: #ffffff; }
                    .alert-box { background: rgba(31, 136, 61, 0.2); }
                }
            </style>
            <div class="container">
                <div class="alert-box">
                    <p class="alert-title"><strong>Specialized collections</strong></p>
                    <p class="alert-content">Dedicated enums for Lists, Root, and Table elements with standards-compliant tag names</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Standards compliance</strong></p>
                    <p class="alert-content">W3C and MDN-compliant HTML tag definitions with proper categorization and documentation</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>String-backed enums</strong></p>
                    <p class="alert-content">
                        Typed HTML tag collections for block, inline, list, root, table, metadata, and void elements
                    </p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Type-safe tag enums</strong></p>
                    <p class="alert-content">Standards-aligned tag sets for Block, Inline, Lists, Root, Table and Voids elements</p>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
