<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Backed Enum Interop</text>
        <text class="content" x="40" y="78">String-backed PHP enums for predictable HTML tag names</text>
        <text class="content" x="40" y="98">BackedEnum-friendly values for builders and reusable components</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Block &amp; Inline Tags</text>
        <text class="content" x="630" y="78">Dedicated Block and Inline enums for common HTML element sets</text>
        <text class="content" x="630" y="98">Standards-aligned names for document and phrasing content</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">List &amp; Table Tags</text>
        <text class="content" x="40" y="198">Specialized Lists and Table enums for structured markup</text>
        <text class="content" x="40" y="218">Typed cases for ul, ol, li, table, thead, tbody, tr, th and td</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Metadata Tags</text>
        <text class="content" x="630" y="198">Separate MetadataBlock and MetadataVoid enums for head content</text>
        <text class="content" x="630" y="218">Script, style and template alongside base, link and meta</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Root Elements</text>
        <text class="content" x="40" y="318">Root enum for html, head and body document structure</text>
        <text class="content" x="40" y="338">Clear boundaries for top-level HTML document composition</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Void Elements</text>
        <text class="content" x="630" y="318">Void enum for self-closing HTML elements like br, img and input</text>
        <text class="content" x="630" y="338">Safe tag selection for renderers that distinguish empty elements</text>
    </g>
</svg>
